<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보호자 설정 · 긴급 연락처</title>
<style>
  body { margin: 0 auto; max-width: 32rem; padding: 1rem; font: 18px/1.5 system-ui, sans-serif; background: #111; color: #fff; }
  input, button { font: inherit; padding: .5rem; margin: .25rem 0; }
  input { width: 100%; box-sizing: border-box; }
  li { margin: .5rem 0; }
  a { color: #9cf; }
</style>
</head>
<body>
<h1>긴급 연락처 (보호자 설정)</h1>
<p>119(소방·구급)와 112(경찰)는 항상 먼저 나오며 지울 수 없습니다. 여기서 추가한 연락처는 그 뒤에 붙습니다.
  연락처는 <strong>이 휴대폰 안에만</strong> 저장되고 서버로 보내지 않습니다.</p>
<ol id="list"></ol>
<form id="add">
  <label>이름 <input id="name" required maxlength="20" autocomplete="off"></label>
  <label>전화번호 <input id="number" required inputmode="tel" autocomplete="off" placeholder="010-1234-5678"></label>
  <button type="submit">추가</button>
</form>
<p id="message" role="status"></p>
<p><a href="./">보행 도우미 화면으로 돌아가기</a></p>
<script>
"use strict";
const KEY = "walkaid.contacts"; // app.js 의 CONTACTS_KEY 와 같은 키
const list = document.getElementById("list");
const message = document.getElementById("message");

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch {
    return [];
  }
}

function save(contacts) {
  try {
    localStorage.setItem(KEY, JSON.stringify(contacts));
    return true;
  } catch {
    message.textContent = "이 브라우저에서는 저장할 수 없습니다.";
    return false;
  }
}

function render() {
  list.replaceChildren();
  for (const fixed of ["119 소방 구급", "112 경찰"]) {
    const item = document.createElement("li");
    item.textContent = `${fixed} (기본)`;
    list.append(item);
  }
  load().forEach((contact, index) => {
    const item = document.createElement("li");
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "삭제";
    remove.setAttribute("aria-label", `${contact.name} 삭제`);
    remove.addEventListener("click", () => {
      const contacts = load();
      contacts.splice(index, 1);
      if (save(contacts)) message.textContent = `${contact.name} 을(를) 지웠습니다.`;
      render();
    });
    item.append(`${contact.name} ${contact.number} `, remove);
    list.append(item);
  });
}

document.getElementById("add").addEventListener("submit", (event) => {
  event.preventDefault();
  const name = document.getElementById("name").value.trim();
  const number = document.getElementById("number").value.replace(/[\s-]/g, "");
  if (!name || !/^[0-9+]{2,20}$/.test(number)) {
    message.textContent = "이름과 숫자로 된 전화번호를 입력하세요.";
    return;
  }
  if (save([...load(), { name, number }])) {
    message.textContent = `${name} 을(를) 추가했습니다.`;
    event.target.reset();
  }
  render();
});

render();
</script>
</body>
</html>
