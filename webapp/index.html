<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>보행 도우미</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; }
  body {
    display: grid; grid-template-rows: 2fr 1fr; grid-template-columns: 1fr 1fr; gap: 4px;
    font-family: system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  button {
    border: 0; margin: 0; background: #000; color: #fff; font: inherit; font-size: 7vmin;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }
  #walk { grid-column: 1 / 3; border-bottom: 2px solid #222; }
  #info { border-right: 2px solid #222; }
  video { display: none; }
</style>
</head>
<body>
<button id="walk" type="button" aria-label="보행 안내. 누르면 시작하고, 다시 누르면 멈춥니다">보행 안내</button>
<button id="info" type="button" aria-label="시간과 배터리. 누르면 현재 시각과 배터리를 읽어 줍니다">시간</button>
<button id="call" type="button" aria-label="긴급 전화. 짧게 누르면 연락처를 바꾸고, 2초 동안 길게 누르면 전화를 겁니다">긴급 전화</button>
<video id="camera" muted playsinline></video>
<script src="app.js"></script>
</body>
</html>
